appId: com.chotatam.dayby
name: Вход через соцсети
tags:
  - auth
---
- runFlow: ../subflows/launch.yaml
- assertVisible:
    id: login_social_google
- assertVisible:
    id: login_social_facebook
- assertVisible:
    id: login_social_x
- tapOn:
    id: login_social_google
- extendedWaitUntil:
    visible:
      id: home_progress
    timeout: 5000
- tapOn:
    id: home_profile
- assertVisible:
    id: profile_name
    text: User Name
- assertVisible:
    id: profile_email
    text: useremail@gmail.com
