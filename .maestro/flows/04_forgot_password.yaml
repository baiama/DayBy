appId: com.chotatam.dayby
name: Восстановление пароля
tags:
  - auth
---
- runFlow: ../subflows/launch.yaml
- tapOn:
    id: login_forgot_password
- assertVisible: Восстановление пароля
- tapOn:
    id: forgot_submit
- assertVisible: Введите почту
- tapOn:
    id: forgot_email
- inputText: tester@dayby.app
- pressKey: Enter
- tapOn:
    id: forgot_submit
- assertVisible: Ссылка для сброса отправлена на tester@dayby.app
- assertVisible:
    id: login_submit
